services:
  - type: web
    name: annadata-inference-api
    env: python
    buildCommand: pip install -r api/requirements_api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: MODEL_DOWNLOAD_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
